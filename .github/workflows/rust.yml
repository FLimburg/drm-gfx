name: Rust

on:
  push:
    branches:
      - main
      - develop
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_stable-${{ hashFiles('**/Cargo.toml') }}
      - name: Format
        run: cargo fmt --all -- --check
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_nightly-${{ hashFiles('**/Cargo.toml') }}
      - name: Documentation
        run: cargo doc

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y libdrm-dev
      - name: Fetch drm headers
        run: ./.github/workflows/fetch_headers.sh
      - uses: dtolnay/rust-toolchain@1.70.0
        with:
          components: clippy
        # TODO: Remove once our MSRV is past 1.84 for the new resolver
      - uses: dtolnay/rust-toolchain@1.84.0
      - name: Downgrade msrv aware
        run: env CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +1.84 generate-lockfile
      - name: Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust_1.70.0-${{ hashFiles('**/Cargo.toml') }}
      - name: Build cache
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-build-rust_1.70.0-check-${{ hashFiles('**/Cargo.toml') }}
      - name: Clippy
        run: cargo +1.70.0 clippy --all --all-features -- -D warnings -A clippy::redundant_static_lifetimes

  test:
    needs:
      - format
      - doc
      - check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          RUST_BACKTRACE: full
          RUST_LOG: trace
        run: cargo test --all
