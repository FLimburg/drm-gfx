name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: check
      run: cargo check --verbose
    - name: format
      run: cargo fmt --all -- --check
    - name: clippy
      run: rustup component add clippy
           cargo clippy --all --all-features --all-targets -- -D warnings -A clippy::redundant_static_lifetimes
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
